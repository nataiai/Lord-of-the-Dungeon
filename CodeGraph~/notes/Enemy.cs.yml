Enemy:
  kind: summary
  text: >
    A monster that chases the player and hurts it on touch. Any death (killed, or 360 s of
    `lifeSpan` running out) drops its loot; only a kill also unlocks its type for chat summons.
  mentions: [Enemy.lifeSpan, Enemy.Died, SimpleSummonDB.Unlock]
  by: ai
  anchor: {hash: 10b1665a, commit: fee0cf8}
  review: {status: unreviewed}

Enemy.Update:
  kind: summary
  text: >
    It spawns as a trigger and turns solid once nothing overlaps it (fliers with `ignoreCollide`
    stay passable). Unless stunned, it faces the player and walks to it around walls with
    `PathFinding.Direction` (fliers go straight), kept apart from other enemies by `PathFinding.Separation`.
  mentions: [EnemySO.ignoreCollide, Character.StuntMech, PathFinding.Direction, PathFinding.Separation]
  image:
    path: images/enemy-update.svg
    alt: "Top-down sketch: an enemy walks around a rock to reach the player, a second enemy is pushed apart, a ghost flies straight through."
  by: ai
  anchor: {hash: d1033f11, commit: fee0cf8}
  review: {status: unreviewed}

Enemy.Died:
  kind: summary
  text: >
    Runs every frame while the enemy is dying. The first call drops loot and, for a kill only,
    unlocks the type for chat and keeps a hidden copy as the summon template. It flashes white
    and is destroyed 0.5 s later.
  mentions: [Loot.Drop, SimpleSummonDB.Unlock, Enemy.AddSummonTemplate]
  by: ai
  anchor: {hash: 5812bd4c, commit: fee0cf8}
  review: {status: unreviewed}

Enemy.OnTriggerStay2D:
  kind: summary
  text: >
    Touch damage: a `Character` of another team that overlaps it is knocked back and takes
    `attackPhysic` damage, at most once per `cooldown`, and never while this enemy is dying.
  mentions: [Character.IsEnemyOf, CombatStat.attackPhysic, EnemySO.cooldown]
  by: ai
  anchor: {hash: 504640ac, commit: fee0cf8}
  review: {status: unreviewed}

Enemy.recieveDamage:
  kind: usage
  text: >
    Shows the enemy's name first (that is how viewers learn what to type to summon it), then takes
    `dmg` minus its defense, at least 1, and flashes red. Once dead it only shows the name.
  mentions: [UI.ShowText, Enemy.HurtColor]
  by: ai
  anchor: {hash: 4e5654e0, commit: fee0cf8}
  review: {status: unreviewed}
