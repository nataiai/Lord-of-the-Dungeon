<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Hole.Fall: what happens when something falls in</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="219" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="18" y="27" font-size="14" font-weight="600" fill="#1f2328">Hole.Fall · what happens when something falls in</text>

  <!-- 1: touches the hole -->
  <text x="112" y="58" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">1 · touches the hole</text>
  <ellipse cx="112" cy="140" rx="58" ry="22" fill="#24292f"/>
  <circle cx="150" cy="118" r="14" fill="#0072B2"/>
  <text x="112" y="190" font-size="11" fill="#57606a" text-anchor="middle">stops moving, can't hit or pick up</text>

  <line x1="196" y1="132" x2="236" y2="132" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2: falls -->
  <text x="330" y="58" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">2 · falls</text>
  <ellipse cx="330" cy="140" rx="58" ry="22" fill="#24292f"/>
  <circle cx="330" cy="128" r="14" fill="#0072B2" fill-opacity=".18"/>
  <circle cx="330" cy="132" r="9" fill="#0072B2" fill-opacity=".45"/>
  <circle cx="330" cy="136" r="5" fill="#0072B2"/>
  <text x="330" y="182" font-size="11" fill="#57606a" text-anchor="middle">plays its fall clip,</text>
  <text x="330" y="197" font-size="11" fill="#57606a" text-anchor="middle">or shrinks away in 0.5 s</text>

  <line x1="414" y1="132" x2="454" y2="132" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3: result -->
  <text x="560" y="58" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">3 · then</text>
  <rect x="474" y="80" width="22" height="22" rx="4" fill="#D55E00"/>
  <text x="485" y="97" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">✗</text>
  <text x="506" y="90" font-size="12" fill="#1f2328">enemy or loot:</text>
  <text x="506" y="105" font-size="12" fill="#1f2328">destroyed</text>
  <circle cx="485" cy="152" r="11" fill="#0072B2"/>
  <text x="506" y="148" font-size="12" fill="#1f2328">player: back where it</text>
  <text x="506" y="163" font-size="12" fill="#1f2328">entered the room</text>
  <text x="506" y="180" font-size="11" fill="#57606a">(Player.Respawn)</text>
</svg>
